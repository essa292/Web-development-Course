<!DOCTYPE html>
<html lang="en">
<head>
    <title>Document</title>
</head>
<body>
    <h2>JavaScript String Methods</h2>
    <p>Basic Methods</p>
    <script>
        var str = "AmaZiNg";
        document.write(str.toUpperCase());
        document.write("<br>");
        document.write(str.toLowerCase());
        document.write("<br>");
        document.write(str.startsWith("A"));
        document.write("<br>");
        var str1 = "   I learnt about string methods in JavaScript.   ";
        var patt = new RegExp("string");
        document.write(patt.test(str1));
        document.write("<br>");
        
    </script>
</body>
</html>
